<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pizza Emergency at the Techno</title>
  <meta name="description" content="A very slow, very old school pizza emergency. You found the secret.">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#17141a">
  <link href="/files/pizza-icon.png" rel="shortcut icon" type="image/png">
  <link href="emergency.css?v=20261105a" rel="stylesheet" type="text/css">
</head>
<body>
  <main class="gb" aria-label="Pizza Emergency at the Techno, a retro game">
    <div class="gb__screen">
      <canvas id="screen" width="160" height="144" role="img" aria-label="Game screen"></canvas>
    </div>
    <p class="gb__brand"><b>PIZZA</b>BOY <span>COLOR-ISH</span></p>

    <div class="gb__pad" aria-hidden="true">
      <div class="dpad" data-dpad><span class="dpad__u"></span><span class="dpad__r"></span><span class="dpad__d"></span><span class="dpad__l"></span><span class="dpad__c"></span></div>
      <div class="ab">
        <button class="ab__btn ab__btn--b" type="button" data-key="b" tabindex="-1">B</button>
        <button class="ab__btn ab__btn--a" type="button" data-key="a" tabindex="-1">A</button>
      </div>
      <div class="ss">
        <button class="ss__btn" type="button" data-key="select" tabindex="-1"><i></i>SOUND</button>
        <button class="ss__btn" type="button" data-key="start" tabindex="-1"><i></i>START</button>
      </div>
    </div>

    <p class="gb__keys">Arrows / WASD to move &middot; <kbd>Z</kbd> / <kbd>Space</kbd> = A &middot; <kbd>X</kbd> = B &middot; <kbd>Enter</kbd> = Start &middot; <kbd>M</kbd> = sound</p>
    <p class="gb__exit">
      <button class="gb__ticket" type="button" data-bogo-open hidden>&#127903; Your BOGO ticket</button>
      <a href="https://pizzaandtechno.com/">&larr; pizzaandtechno.com</a>
    </p>
  </main>

  <!-- the BOGO ticket from behind the poster at the Techno (see party.js) -->
  <div class="bogo" data-bogo hidden role="dialog" aria-modal="true" aria-labelledby="bogo-title">
    <div class="bogo__card">
      <div class="bogo__stub" aria-hidden="true"><b>2</b><span>for</span><b>1</b></div>
      <div class="bogo__body">
        <p class="bogo__kicker">You found it</p>
        <h2 id="bogo-title">BOGO ticket</h2>
        <p class="bogo__what">Buy one ticket to the next Pizza+Techno, get one free.</p>
        <p class="bogo__code"><code data-bogo-code></code><button type="button" data-bogo-copy>Copy</button></p>
        <a class="bogo__go" data-bogo-link href="https://pizzaandtechno.com/" target="_blank" rel="noopener">Tickets drop at pizzaandtechno.com</a>
        <p class="bogo__note" data-bogo-note></p>
        <button class="bogo__close" type="button" data-bogo-close>Back to the party</button>
      </div>
    </div>
  </div>
  <script src="party.js?v=20261105a"></script>
  <script src="game.js?v=20261105a"></script>
</body>
</html>
